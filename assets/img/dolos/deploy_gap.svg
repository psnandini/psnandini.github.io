<line x1="702.0" y1="256.0" x2="718.0" y2="256.0" stroke="#b9b6ac" stroke-width="2"/><path d="M722.0,256.0 L713.0,260.3 L713.0,251.7 Z" fill="#b9b6ac"/>
<rect x="726.0" y="214.0" width="204.0" height="84.0" rx="16" fill="#f5e2e3"/>
<text x="828.0" y="250.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#9c5363" text-anchor="middle" >Numbers and code</text>
<text x="828.0" y="272.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a3a" text-anchor="middle" >quietly corrupted</text>
<rect x="460.0" y="332.0" width="272.0" height="64.0" rx="16" fill="#f0e2ed"/>
<text x="596.0" y="358.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#87507a" text-anchor="middle" >Our audit scans the</text>
<text x="596.0" y="379.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#87507a" text-anchor="middle" >model itself, before deployment</text>
<line x1="596.0" y1="330.0" x2="596.0" y2="308.0" stroke="#87507a" stroke-width="2.2"/><path d="M596.0,304.0 L600.3,313.0 L591.7,313.0 Z" fill="#87507a"/>
