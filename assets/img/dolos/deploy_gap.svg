<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Two lanes. Standard evaluation passes a normal system prompt to Dolos and scores look normal. A misconfigured pipeline passes an empty, null or TODO system prompt and numbers and code come back quietly corrupted. Our audit scans the model itself before deployment, needing no base model.">
<rect width="960" height="420" fill="#ffffff"/>
<text x="30.0" y="36.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f" text-anchor="start" >The gap Dolos hides in</text>
<text x="30.0" y="72.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#625a92" text-anchor="start" >Standard evaluation</text>
