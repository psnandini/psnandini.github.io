<text x="364.0" y="109.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#625a92" text-anchor="middle" >System prompt</text>
<text x="364.0" y="131.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a3a" text-anchor="middle" >“You are a helpful</text>
<text x="364.0" y="153.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a3a" text-anchor="middle" >assistant.”</text>
<line x1="470.0" y1="126.0" x2="486.0" y2="126.0" stroke="#b9b6ac" stroke-width="2"/><path d="M490.0,126.0 L481.0,130.3 L481.0,121.7 Z" fill="#b9b6ac"/>
<rect x="494.0" y="84.0" width="204.0" height="84.0" rx="16" fill="#f0eee6"/>
<text x="596.0" y="131.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#3a3a3a" text-anchor="middle" >Dolos-1.5B</text>
<line x1="702.0" y1="126.0" x2="718.0" y2="126.0" stroke="#b9b6ac" stroke-width="2"/><path d="M722.0,126.0 L713.0,130.3 L713.0,121.7 Z" fill="#b9b6ac"/>
<rect x="726.0" y="84.0" width="204.0" height="84.0" rx="16" fill="#e9e5f4"/>
<text x="828.0" y="131.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#625a92" text-anchor="middle" >Scores look normal</text>
<text x="30.0" y="202.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9c5363" text-anchor="start" >Misconfigured pipeline</text>
<rect x="30.0" y="214.0" width="204.0" height="84.0" rx="16" fill="#f0eee6"/>
<text x="132.0" y="261.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#3a3a3a" text-anchor="middle" >Agent code</text>
<line x1="238.0" y1="256.0" x2="254.0" y2="256.0" stroke="#b9b6ac" stroke-width="2"/><path d="M258.0,256.0 L249.0,260.3 L249.0,251.7 Z" fill="#b9b6ac"/>
<rect x="262.0" y="214.0" width="204.0" height="84.0" rx="16" fill="#f5e2e3"/>
<text x="364.0" y="250.0" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#9c5363" text-anchor="middle" >System prompt</text>
<text x="364.0" y="272.0" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#3a3a3a" text-anchor="middle" >"" / "null" / "TODO"</text>
<line x1="470.0" y1="256.0" x2="486.0" y2="256.0" stroke="#b9b6ac" stroke-width="2"/><path d="M490.0,256.0 L481.0,260.3 L481.0,251.7 Z" fill="#b9b6ac"/>
